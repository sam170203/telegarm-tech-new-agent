name: Daily Tech News Briefing

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Show Python info
        run: |
          python --version
          which python || which python3
          python -c "import sys; print(sys.executable); print('\n'.join(sys.path))"

      - name: Clear pip cache
        run: python -m pip cache purge || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall -r requirements.txt

      - name: List installed packages
        run: python -m pip list

      - name: Restore briefing database from previous run
        uses: actions/cache@v4
        with:
          path: data/briefing.db
          key: setup-python-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            briefing-db-

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Show repo files (debug)
        run: ls -la

      - name: Run briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: openrouter
          LLM_MODEL: anthropic/claude-sonnet-4.6
          TIMEZONE: Asia/Kolkata
          DB_PATH: ./data/briefing.db
          LOG_LEVEL: INFO
          BRIEFING_HOUR: '9'
          BRIEFING_MINUTE: '0'
          HN_FETCH_LIMIT: '50'
          REDDIT_FETCH_LIMIT: '0'
          GITHUB_FETCH_LIMIT: '100'
          ARXIV_FETCH_LIMIT: '50'
          RANK_WEIGHT_RELEVANCE: '0.4'
          RANK_WEIGHT_VIRALITY: '0.3'
          RANK_WEIGHT_DEPTH: '0.2'
          RANK_WEIGHT_NOVELTY: '0.1'
          ITEMS_PER_BRIEFING: '10'
        run: python3 main.py run-now
